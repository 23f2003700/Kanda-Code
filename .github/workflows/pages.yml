name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "outputs/figures/**"
      - "src/build_presentation.py"
      - "src/build_viva.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web deck from presentation/slides
        run: python src/build_presentation.py
      - name: Put the viva deck at the site root (classic deck moves to /classic)
        run: python src/build_viva.py --publish-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation/web
      - id: deployment
        uses: actions/deploy-pages@v4
